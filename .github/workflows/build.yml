name: Build

# Build the image and smoke test it on every PR and push to main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The token only raises the GitHub API rate limit for release lookups.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: goliath:ci
          build-args: |
            VERSION=ci
          secrets: |
            GITHUB_TOKEN=${{ github.token }}

      - name: Smoke test
        run: scripts/smoke-test.sh goliath:ci

---
- hosts: localhost
  connection: local
  become: no
  gather_facts: yes

  vars:
    home: "/home/{{user}}"
    github_token: "{{ github_token | default(omit) }}"
    atuin:
      server: "{{ atuin_server }}"
      version: "{{ atuin_version }}"
      arch: x86_64
      # Set to yes if home is on a network mount, see the README.
      db_on_tmpfs: no
    codeserver:
      auth: yes # Set to no when using another front end for auth, password shown at first boot
    claude_code:
      channel: stable # stable, latest or a pinned version such as 2.1.89
      auto_update: yes
      remote_control:
        autostart: no # Start claude-rc on boot once logged in, requires tmux
        spawn: same-dir # same-dir, worktree (needs a git repo) or session
        workdir: "{{ home }}/workspace" # Claude will not trust $HOME as a workspace
    install:
      awscli: yes
      atuin: yes
      brew: no
      claude_code: yes
      codeserver: yes
      codex: yes
      docker_cli: yes
      gruntwork: yes
      hashicorp: yes
      kubernetes_cli: yes
      sops: yes
      ssh_server: yes
      terraform: yes
      tmux: yes
      vim: yes

  pre_tasks:
    - name: Set Version ENV
      become: yes
      lineinfile:
        dest: /etc/environment
        state: present
        regexp: '^GOLIATH_VERSION'
        line: 'GOLIATH_VERSION={{ version }}'

  roles:
    - role: system_config
    - role: shell_config
    - role: markosamuli.linuxbrew
      linuxbrew_use_installer: true
      linuxbrew_init_shell: false
      linuxbrew_install_checksum: "sha256:9af575eb52eda83d546963db3ebed65d840738bc533ca195dcf3eb6ca2d6c7e7"
      when: install.brew
    - role: deekayen.awscli2
      become: yes
      when: install.awscli

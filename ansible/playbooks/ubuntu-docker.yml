---
- hosts: localhost
  connection: local
  become: no
  gather_facts: yes

  vars:
    home: "/home/{{user}}"
    github_token: "{{ github_token | default(omit) }}"
    atuin:
      server: "{{ atuin_server }}"
      version: "{{ atuin_version }}"
      arch: x86_64
      # Set to yes if home is on a network mount, see the README.
      db_on_tmpfs: no
    codeserver:
      auth: yes # Set to no when using another front end for auth, password shown at first boot
      cert: yes # Serve HTTPS with a self-signed certificate
    claude_code:
      channel: stable # stable, latest or a pinned version such as 2.1.89
      auto_update: yes
      remote_control:
        autostart: yes # Start claude-rc on boot once logged in, requires tmux
        spawn: same-dir # same-dir, worktree (needs a git repo) or session
        permission_mode: auto # auto, acceptEdits, plan or default, for sessions started remotely
        workdir: "{{ home }}/workspace" # Claude will not trust $HOME as a workspace
    talosctl_version: latest # Or a version matching your cluster, such as 1.13.8
    uv:
      python_downloads: manual # automatic, manual or never, see UV_PYTHON_DOWNLOADS
    install:
      awscli: yes
      atuin: yes
      brew: no
      claude_code: yes
      codeserver: yes
      codex: yes
      direnv: yes
      docker_cli: yes
      fnm: yes
      github_known_hosts: yes
      gruntwork: yes
      hashicorp: yes
      k9s: yes
      kubernetes_cli: yes
      mosh: no # Also publish UDP ports, see the README
      playwright_deps: no # Libraries for Playwright's Chromium, a few hundred MB
      sops: yes
      ssh_server: yes
      talosctl: yes
      terraform: yes
      terraform_docs: yes
      tflint: yes
      tmux: yes
      uv: yes
      vim: yes
      yq: yes

  pre_tasks:
    - name: Set Version ENV
      become: yes
      lineinfile:
        dest: /etc/environment
        state: present
        regexp: '^GOLIATH_VERSION'
        line: 'GOLIATH_VERSION={{ version }}'

  roles:
    - role: system_config
    - role: shell_config
    - role: markosamuli.linuxbrew
      linuxbrew_use_installer: true
      linuxbrew_init_shell: false
      linuxbrew_install_checksum: "sha256:9af575eb52eda83d546963db3ebed65d840738bc533ca195dcf3eb6ca2d6c7e7"
      when: install.brew
    - role: deekayen.awscli2
      become: yes
      when: install.awscli

  # Runs after shell_config, which installs nodejs.
  post_tasks:
    - name: Install Playwright system dependencies for Chromium
      become: yes
      command: npx -y playwright@latest install-deps chromium
      when: install.playwright_deps

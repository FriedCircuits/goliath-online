---
- name: Install prezto
  git:
    repo: https://github.com/sorin-ionescu/prezto.git
    dest: "{{ home }}/.zprezto"
    force: yes
  become_user: "{{ user }}"

- name: Add symbolic link dotfiles
  file:
    src: "{{ home }}/.zprezto/runcoms/{{ item }}"
    dest: "{{ home }}/.{{ item }}"
    state: "link"
    owner: "{{ user }}"
    group: "{{ user }}"
  with_items:
    - zlogin
    - zlogout
    - zprofile
    - zshenv

- name: Set .zshrc
  template:
    src: .zshrc.j2
    dest: "{{ home }}/.zshrc"
    owner: "{{ user }}"
    group: "{{ user }}"

# Kept outside the home volume so it updates with each rebuild.
- name: Set image zshrc
  become: yes
  block:
    - name: Create /etc/goliath
      file:
        path: /etc/goliath
        state: directory
        mode: 0755

    - name: Set /etc/goliath/zshrc
      template:
        src: .zshrc.custom.j2
        dest: /etc/goliath/zshrc
        mode: 0644

- name: Set .zshrc.custom
  template:
    src: .zshrc.custom.user.j2
    dest: "{{ home }}/.zshrc.custom"
    owner: "{{ user }}"
    group: "{{ user }}"
    force: no

- name: Make directory .zsh.d
  file:
    path: "{{ home }}/.zsh.d"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"

- name: Make directory .zsh_prompts
  file:
    path: "{{ home }}/.zsh_prompts"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"

- name: copy custom theme
  copy:
    src: prompt_sorin_custom_setup
    dest: "{{ home }}/.zsh_prompts/"

- name: Switch to zsh
  user:
    name: "{{ user }}"
    shell: /usr/bin/zsh
  become: yes

- name: Copy Pretzo custom config
  template:
    src: .zpreztorc
    dest: "{{ home }}"
    owner: "{{ user }}"
    group: "{{ user }}"

- name: Install spaceship
  become: yes
  npm:
    name: spaceship-prompt
    global: yes
  when: install_spaceship

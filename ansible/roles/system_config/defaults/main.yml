# Default system packages to install
system_packages:
  - locales
  - locales-all
  - curl
  - gpg
  - htop
  - net-tools
  - dnsutils
  - netcat-traditional
  - jq
  - ripgrep
  - make
  - dos2unix

# Configure which packages to install.
install:
  brew: no
  claude_code: no
  codeserver: no
  codex: no
  docker_cli: yes
  gruntwork: yes
  hashicorp: yes
  kubernetes_cli: yes
  sops: yes
  ssh_server: yes
  terraform: yes
  tmux: yes
  vim: yes

# If enabled above install these tools from Hashicorp repo.
# Terraform is installed seperately above.
hashicorp_tools:
  - packer

# Kf enabled above install these packages via brew.
# Note it seems most if not all brew packages increase image size significantly.
brew_packages:
  - lastpass-cli

codeserver:
  auth: yes # Disable if using your own auth such as authelia with traefik
  cert: yes # Serve HTTPS with a self-signed certificate

claude_code:
  channel: stable # stable, latest or a pinned version such as 2.1.89
  auto_update: yes
  remote_control:
    autostart: yes # Start claude-rc on boot once logged in, requires tmux
    spawn: same-dir # same-dir, worktree (needs a git repo) or session
    permission_mode: auto # auto, acceptEdits, plan or default, for sessions started remotely
    workdir: "{{ home }}/workspace" # Claude will not trust $HOME as a workspace

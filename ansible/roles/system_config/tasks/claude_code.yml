- name: Claude Code | Download installer
  get_url:
    url: https://claude.ai/install.sh
    dest: /tmp/claude-installer.sh
    mode: 0755

# Installs to ~/.local/bin/claude. Accepts stable, latest or a pinned version.
- name: Claude Code | Install
  command: "/tmp/claude-installer.sh {{ claude_code.channel }}"
  args:
    creates: "{{ home }}/.local/bin/claude"

- name: Claude Code | Create Remote Control workspace
  file:
    path: "{{ claude_code.remote_control.workdir }}"
    state: directory

- name: Claude Code | Install Remote Control helper
  template:
    src: claude-rc.j2
    dest: "{{ home }}/.bin/claude-rc"
    mode: 0755
  when: install.tmux

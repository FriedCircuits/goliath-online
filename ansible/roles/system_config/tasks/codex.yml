- name: Codex | Get latest
  github_release:
    user: openai
    repo: codex
    action: latest_release
    token: "{{ github_token | default(omit) }}"
  register: codex_latest

- name: Codex | Download latest
  get_url:
    url: "https://github.com/openai/codex/releases/download/{{ codex_latest['tag'] }}/codex-x86_64-unknown-linux-musl.tar.gz"
    dest: /tmp/codex.tar.gz
    mode: 0600

- name: Codex | Unarchive latest
  ansible.builtin.unarchive:
    src: /tmp/codex.tar.gz
    dest: /tmp/
    remote_src: yes

- name: Codex | Install latest
  become: yes
  copy:
    src: /tmp/codex-x86_64-unknown-linux-musl
    dest: /usr/local/bin/codex
    mode: 0755
    remote_src: yes
